spring.application.name=food-ordering-system
server.port=${PORT:8080}

# ---------- MySQL ----------
spring.datasource.url=jdbc:mysql://localhost:3306/food_ordering_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}

# ---------- JPA / Hibernate ----------
# 'update' is fine while learning. Switch to 'validate' + Flyway/Liquibase for production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------- JWT ----------
# Must be at least 32 characters for HS256. Override with an environment variable outside dev.
app.jwt.secret=${JWT_SECRET:change-this-dev-secret-key-to-something-long-and-random-123456}
app.jwt.expiration-ms=86400000

# ---------- CORS (React dev server) ----------
# 5173 = Vite, 3000 = Create React App
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ---------- Swagger ----------
springdoc.swagger-ui.path=/swagger-ui.html
